name: Host true KVM guest reboot acceptance (pinned M)

on:
  workflow_dispatch:
    inputs:
      cached_public_run:
        description: Optional reviewed same-repository public payload cache run ID; pair with artifact ID
        type: string
        default: ''
      cached_public_artifact_id:
        description: Optional reviewed exact public payload cache artifact ID; empty means full public GET
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: host-browser-acceptance
  cancel-in-progress: false

jobs:
  true-guest-reboot:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/host-reboot-browsers
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: dcf8d9a60976c160e2b2aca33313c668c071132c
          path: product-M
          persist-credentials: false
      - name: Require an actual usable nested KVM VM; never fall back to TCG
        run: |
          sudo --preserve-env=CI,GITHUB_ACTIONS,RUNNER_ENVIRONMENT,GITHUB_REPOSITORY,RUNNER_TEMP python3 harness/scripts/host/host-reboot-acceptance.py --product-source "$GITHUB_WORKSPACE/product-M" --output "$RUNNER_TEMP/host-reboot-summary" --probe-only
      - name: Validate optional reviewed public cache IDs
        env:
          CACHED_PUBLIC_RUN: ${{ inputs.cached_public_run }}
          CACHED_PUBLIC_ARTIFACT_ID: ${{ inputs.cached_public_artifact_id }}
        run: |
          python3 - <<'PY'
          import os, re
          values = [os.environ[name] for name in ('CACHED_PUBLIC_RUN', 'CACHED_PUBLIC_ARTIFACT_ID')]
          if bool(values[0]) != bool(values[1]) or any(value and not re.fullmatch(r'[1-9][0-9]{0,19}', value) for value in values):
              raise SystemExit('Cache run and artifact IDs must be paired positive integers')
          PY
      - uses: actions/download-artifact@v4
        if: inputs.cached_public_run != '' && inputs.cached_public_artifact_id != ''
        with:
          artifact-ids: ${{ inputs.cached_public_artifact_id }}
          run-id: ${{ inputs.cached_public_run }}
          github-token: ${{ github.token }}
          repository: heavenzhang/MoXBots
          path: ${{ runner.temp }}/host-public-cache-input
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '12123324723'
          run-id: '39093243842'
          github-token: ${{ github.token }}
          repository: heavenzhang/MoXBots
          path: ${{ runner.temp }}/host-reboot-service-M
          merge-multiple: true
      - name: Prepare disposable guest and outer real browser lab
        run: |
          ! systemctl is-active --quiet nginx.service
          ! pgrep -x nginx
          sudo systemctl mask nginx.service
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y nginx libnss3-tools apache2-utils python3-venv qemu-system-x86 qemu-utils cloud-image-utils openssh-client
          python3 -m venv "$RUNNER_TEMP/host-reboot-venv"
          "$RUNNER_TEMP/host-reboot-venv/bin/pip" install 'playwright==1.58.0'
          "$RUNNER_TEMP/host-reboot-venv/bin/python" -m playwright install --with-deps chromium
      - name: Fresh real browser install and true guest reboot with original identity
        env:
          CACHED_PUBLIC_RUN: ${{ inputs.cached_public_run }}
          CACHED_PUBLIC_ARTIFACT_ID: ${{ inputs.cached_public_artifact_id }}
        run: |
          public_args=()
          if [[ -n "$CACHED_PUBLIC_RUN" ]]; then
            public_args=(--cached-public-payload "$RUNNER_TEMP/host-public-cache-input" --cached-public-run "$CACHED_PUBLIC_RUN" --cached-public-artifact-id "$CACHED_PUBLIC_ARTIFACT_ID")
          fi
          sudo --preserve-env=CI,GITHUB_ACTIONS,RUNNER_ENVIRONMENT,GITHUB_REPOSITORY,GITHUB_RUN_ID,RUNNER_TEMP,PLAYWRIGHT_BROWSERS_PATH "$RUNNER_TEMP/host-reboot-venv/bin/python" harness/scripts/host/host-reboot-acceptance.py --product-source "$GITHUB_WORKSPACE/product-M" --service-artifact "$RUNNER_TEMP/host-reboot-service-M" --output "$RUNNER_TEMP/host-reboot-summary" "${public_args[@]}"
      - name: Upload only explicit non-secret reboot or KVM blocker summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-true-reboot-acceptance-${{ github.run_id }}
          path: ${{ runner.temp }}/host-reboot-summary/summary.json
          if-no-files-found: warn
          retention-days: 14
