name: Host true KVM guest reboot acceptance (pinned P)

on:
  workflow_dispatch:
    inputs:
      capability_only:
        description: Probe actual KVM_CREATE_VM only; skip dependencies, payload GET and installation
        type: boolean
        default: false
      cached_public_run:
        description: Optional reviewed same-repository public payload cache run ID; pair with artifact ID
        type: string
        default: ''
      cached_public_artifact_id:
        description: Optional reviewed exact public payload cache artifact ID; empty means full public GET
        type: string
        default: ''
      candidate_run:
        description: Reviewed same-repository isolated candidate run; pair with artifact ID, excludes public cache
        type: string
        default: ''
      candidate_artifact_id:
        description: Exact candidate artifact; integrity pins remain in reviewed harness source
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: host-browser-acceptance
  cancel-in-progress: false

jobs:
  true-guest-reboot:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Set one shared browser path after the runner is allocated
        run: printf 'PLAYWRIGHT_BROWSERS_PATH=%s\n' "$RUNNER_TEMP/host-reboot-browsers" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 7e4bbdfaa693b3f309c7a879b32d1b386b3b52ca
          path: product-P
          persist-credentials: false
      - name: Require an actual usable nested KVM VM; never fall back to TCG
        run: |
          sudo --preserve-env=CI,GITHUB_ACTIONS,RUNNER_ENVIRONMENT,GITHUB_REPOSITORY,RUNNER_TEMP python3 harness/scripts/host/host-reboot-acceptance.py --product-source "$GITHUB_WORKSPACE/product-P" --output "$RUNNER_TEMP/host-reboot-summary" --probe-only
      - name: Validate optional reviewed public cache IDs
        if: ${{ !inputs.capability_only }}
        env:
          CACHED_PUBLIC_RUN: ${{ inputs.cached_public_run }}
          CACHED_PUBLIC_ARTIFACT_ID: ${{ inputs.cached_public_artifact_id }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
        run: |
          python3 - <<'PY'
          import os, re
          pairs = [(os.environ[a], os.environ[b]) for a, b in [('CACHED_PUBLIC_RUN', 'CACHED_PUBLIC_ARTIFACT_ID'), ('CANDIDATE_RUN', 'CANDIDATE_ARTIFACT_ID')]]
          if sum(bool(pair[0]) for pair in pairs) > 1 or any(bool(a) != bool(b) or any(v and not re.fullmatch(r'[1-9][0-9]{0,19}', v) for v in (a,b)) for a,b in pairs):
              raise SystemExit('Select exactly one paired candidate or public-cache transport, or fresh public GET')
          PY
      - uses: actions/download-artifact@v4
        if: ${{ !inputs.capability_only && inputs.cached_public_run != '' && inputs.cached_public_artifact_id != '' }}
        with:
          artifact-ids: ${{ inputs.cached_public_artifact_id }}
          run-id: ${{ inputs.cached_public_run }}
          github-token: ${{ github.token }}
          repository: heavenzhang/MoXBots
          path: ${{ runner.temp }}/host-public-cache-input
          merge-multiple: true
      - uses: actions/download-artifact@v4
        if: ${{ !inputs.capability_only && inputs.candidate_run != '' && inputs.candidate_artifact_id != '' }}
        with:
          artifact-ids: ${{ inputs.candidate_artifact_id }}
          run-id: ${{ inputs.candidate_run }}
          github-token: ${{ github.token }}
          repository: heavenzhang/MoXBots
          path: ${{ runner.temp }}/host-candidate-input
          merge-multiple: true
      - uses: actions/download-artifact@v4
        if: ${{ !inputs.capability_only }}
        with:
          artifact-ids: '12172099959'
          run-id: '39223945533'
          github-token: ${{ github.token }}
          repository: heavenzhang/MoXBots
          path: ${{ runner.temp }}/host-reboot-service-P
          merge-multiple: true
      - name: Prepare disposable guest and outer real browser lab
        if: ${{ !inputs.capability_only }}
        run: |
          ! systemctl is-active --quiet nginx.service
          ! pgrep -x nginx
          sudo systemctl mask nginx.service
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y nginx libnss3-tools apache2-utils python3-venv qemu-system-x86 qemu-utils cloud-image-utils openssh-client
          python3 -m venv "$RUNNER_TEMP/host-reboot-venv"
          "$RUNNER_TEMP/host-reboot-venv/bin/pip" install 'playwright==1.58.0'
          "$RUNNER_TEMP/host-reboot-venv/bin/python" -m playwright install --with-deps chromium
      - name: Fresh real browser install and true guest reboot with original identity
        if: ${{ !inputs.capability_only }}
        env:
          CACHED_PUBLIC_RUN: ${{ inputs.cached_public_run }}
          CACHED_PUBLIC_ARTIFACT_ID: ${{ inputs.cached_public_artifact_id }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
        run: |
          public_args=()
          if [[ -n "$CANDIDATE_RUN" ]]; then
            public_args=(--candidate-payload "$RUNNER_TEMP/host-candidate-input" --candidate-run "$CANDIDATE_RUN" --candidate-artifact-id "$CANDIDATE_ARTIFACT_ID")
          elif [[ -n "$CACHED_PUBLIC_RUN" ]]; then
            public_args=(--cached-public-payload "$RUNNER_TEMP/host-public-cache-input" --cached-public-run "$CACHED_PUBLIC_RUN" --cached-public-artifact-id "$CACHED_PUBLIC_ARTIFACT_ID")
          fi
          sudo --preserve-env=CI,GITHUB_ACTIONS,RUNNER_ENVIRONMENT,GITHUB_REPOSITORY,GITHUB_RUN_ID,RUNNER_TEMP,PLAYWRIGHT_BROWSERS_PATH "$RUNNER_TEMP/host-reboot-venv/bin/python" harness/scripts/host/host-reboot-acceptance.py --product-source "$GITHUB_WORKSPACE/product-P" --service-artifact "$RUNNER_TEMP/host-reboot-service-P" --output "$RUNNER_TEMP/host-reboot-summary" "${public_args[@]}"
      - name: Upload only explicit non-secret reboot or KVM blocker summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-true-reboot-acceptance-${{ github.run_id }}
          path: ${{ runner.temp }}/host-reboot-summary/summary.json
          if-no-files-found: warn
          retention-days: 14
