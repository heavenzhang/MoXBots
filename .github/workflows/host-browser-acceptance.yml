name: Host fresh browser acceptance (pinned P)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Lab-only session lifetime; neither mode executes a model or business task
        type: choice
        options: [standard, renewal, candidate-build]
        default: standard
      source_commit:
        description: Full reviewed source SHA for candidate-build only; no main or production mutation
        type: string
        default: ''
      cached_public_run:
        description: Optional reviewed same-repository public payload cache run ID; pair with artifact ID
        type: string
        default: ''
      cached_public_artifact_id:
        description: Optional reviewed exact public payload cache artifact ID; empty means full public GET
        type: string
        default: ''
      candidate_run:
        description: Reviewed same-repository isolated candidate run; pair with artifact ID, excludes public cache
        type: string
        default: ''
      candidate_artifact_id:
        description: Exact candidate artifact; integrity pins remain in reviewed harness source
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: host-browser-acceptance
  cancel-in-progress: false

jobs:
  candidate-build:
    if: inputs.mode == 'candidate-build'
    uses: ./.github/workflows/host-candidate.yml
    with:
      source_commit: ${{ inputs.source_commit }}
  disposable-browser:
    if: inputs.mode != 'candidate-build'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Set one shared browser path after the runner is allocated
        run: printf 'PLAYWRIGHT_BROWSERS_PATH=%s\n' "$RUNNER_TEMP/host-browser-browsers" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 7e4bbdfaa693b3f309c7a879b32d1b386b3b52ca
          path: product-P
          persist-credentials: false
      - name: Refuse anything except an empty disposable canonical CI VM
        run: |
          sudo --preserve-env=CI,GITHUB_ACTIONS,RUNNER_ENVIRONMENT,GITHUB_REPOSITORY,RUNNER_TEMP python3 harness/scripts/host/browser-acceptance.py --preflight --product-source "$GITHUB_WORKSPACE/product-P" --output "$RUNNER_TEMP/host-browser-summary"
      - name: Validate optional reviewed public cache IDs
        env:
          CACHED_PUBLIC_RUN: ${{ inputs.cached_public_run }}
          CACHED_PUBLIC_ARTIFACT_ID: ${{ inputs.cached_public_artifact_id }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
        run: |
          python3 - <<'PY'
          import os, re
          pairs = [(os.environ[a], os.environ[b]) for a, b in [('CACHED_PUBLIC_RUN', 'CACHED_PUBLIC_ARTIFACT_ID'), ('CANDIDATE_RUN', 'CANDIDATE_ARTIFACT_ID')]]
          if sum(bool(pair[0]) for pair in pairs) > 1 or any(bool(a) != bool(b) or any(v and not re.fullmatch(r'[1-9][0-9]{0,19}', v) for v in (a,b)) for a,b in pairs):
              raise SystemExit('Select exactly one paired candidate or public-cache transport, or fresh public GET')
          PY
      - uses: actions/download-artifact@v4
        if: inputs.cached_public_run != '' && inputs.cached_public_artifact_id != ''
        with:
          artifact-ids: ${{ inputs.cached_public_artifact_id }}
          run-id: ${{ inputs.cached_public_run }}
          github-token: ${{ github.token }}
          repository: heavenzhang/MoXBots
          path: ${{ runner.temp }}/host-public-cache-input
          merge-multiple: true
      - uses: actions/download-artifact@v4
        if: inputs.candidate_run != '' && inputs.candidate_artifact_id != ''
        with:
          artifact-ids: ${{ inputs.candidate_artifact_id }}
          run-id: ${{ inputs.candidate_run }}
          github-token: ${{ github.token }}
          repository: heavenzhang/MoXBots
          path: ${{ runner.temp }}/host-candidate-input
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '12172099959'
          run-id: '39223945533'
          github-token: ${{ github.token }}
          repository: heavenzhang/MoXBots
          path: ${{ runner.temp }}/host-browser-service-P
          merge-multiple: true
      - name: Prepare browser dependencies on this disposable VM
        run: |
          # Prevent the package postinst from starting a default public listener.
          ! systemctl is-active --quiet nginx.service
          ! pgrep -x nginx
          sudo systemctl mask nginx.service
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y nginx libnss3-tools apache2-utils python3-venv
          python3 -m venv "$RUNNER_TEMP/host-browser-venv"
          "$RUNNER_TEMP/host-browser-venv/bin/pip" install 'playwright==1.58.0'
          "$RUNNER_TEMP/host-browser-venv/bin/python" -m playwright install --with-deps chromium
      - name: Exact P candidate or public bytes, real Dex browser, AuthStore, DPoP, join, catalog and Ready
        env:
          ACCEPTANCE_MODE: ${{ inputs.mode }}
          CACHED_PUBLIC_RUN: ${{ inputs.cached_public_run }}
          CACHED_PUBLIC_ARTIFACT_ID: ${{ inputs.cached_public_artifact_id }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
        run: |
          public_args=()
          if [[ -n "$CANDIDATE_RUN" ]]; then
            public_args=(--candidate-payload "$RUNNER_TEMP/host-candidate-input" --candidate-run "$CANDIDATE_RUN" --candidate-artifact-id "$CANDIDATE_ARTIFACT_ID")
          elif [[ -n "$CACHED_PUBLIC_RUN" ]]; then
            public_args=(--cached-public-payload "$RUNNER_TEMP/host-public-cache-input" --cached-public-run "$CACHED_PUBLIC_RUN" --cached-public-artifact-id "$CACHED_PUBLIC_ARTIFACT_ID")
          elif [[ "$ACCEPTANCE_MODE" = standard ]]; then
            public_args=(--export-public-cache "$RUNNER_TEMP/host-public-cache-export")
          fi
          sudo --preserve-env=CI,GITHUB_ACTIONS,RUNNER_ENVIRONMENT,GITHUB_REPOSITORY,GITHUB_RUN_ID,RUNNER_TEMP,PLAYWRIGHT_BROWSERS_PATH "$RUNNER_TEMP/host-browser-venv/bin/python" harness/scripts/host/browser-acceptance.py --product-source "$GITHUB_WORKSPACE/product-P" --service-artifact "$RUNNER_TEMP/host-browser-service-P" --output "$RUNNER_TEMP/host-browser-summary" --mode "$ACCEPTANCE_MODE" "${public_args[@]}"
      - name: Upload only three verified public immutable cache files
        id: public-cache-upload
        if: always() && inputs.mode == 'standard' && inputs.cached_public_run == '' && inputs.cached_public_artifact_id == '' && inputs.candidate_run == '' && inputs.candidate_artifact_id == ''
        uses: actions/upload-artifact@v4
        with:
          name: host-public-payload-M-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/host-public-cache-export/bootstrap.py
            ${{ runner.temp }}/host-public-cache-export/bundle.tar.gz
            ${{ runner.temp }}/host-public-cache-export/cache-meta.json
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
      - name: Record the actual first public cache artifact in the non-secret summary
        if: always() && steps.public-cache-upload.outputs.artifact-id != ''
        env:
          PUBLIC_CACHE_ARTIFACT_ID: ${{ steps.public-cache-upload.outputs.artifact-id }}
        run: |
          sudo env ACTUAL_PUBLIC_RUN="$GITHUB_RUN_ID" ACTUAL_PUBLIC_ARTIFACT_ID="$PUBLIC_CACHE_ARTIFACT_ID" python3 - "$RUNNER_TEMP/host-browser-summary/summary.json" <<'PY'
          import json, os, pathlib, re, sys
          path = pathlib.Path(sys.argv[1])
          run_id, artifact_id = os.environ['ACTUAL_PUBLIC_RUN'], os.environ['ACTUAL_PUBLIC_ARTIFACT_ID']
          if not all(re.fullmatch(r'[1-9][0-9]{0,19}', value) for value in (run_id, artifact_id)):
              raise SystemExit('Actual public cache identifiers must be positive integers')
          summary = json.loads(path.read_text())
          if summary['publicPayloadInput']['normalTLSFullGETThisRun'] is not True or summary['publicPayloadCacheExported'] is not True:
              raise SystemExit('Only a verified fresh public GET may claim the exported artifact')
          summary['publicPayloadInput']['firstPublicFullGETRun'] = run_id
          summary['publicPayloadInput']['firstPublicFullGETArtifactId'] = artifact_id
          path.write_text(json.dumps(summary, indent=2) + '\n')
          path.chmod(0o644)
          PY
      - name: Upload only the explicit non-secret summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-browser-acceptance-${{ inputs.mode }}-${{ github.run_id }}
          path: ${{ runner.temp }}/host-browser-summary/summary.json
          if-no-files-found: warn
          retention-days: 14
