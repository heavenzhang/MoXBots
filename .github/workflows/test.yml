name: Test

# Regression gate. The whole point of the test suite is to catch regressions
# during fast iteration — so it MUST run automatically on every PR and push,
# not just locally. Required check: a PR that fails this cannot merge.
on:
  workflow_dispatch:
    inputs:
      mobile_ios_app:
        description: Build only the ad-hoc signed offline iOS simulator app
        type: boolean
        default: false
      macos_lifecycle_runner:
        description: ARM full run or Intel macOS-only supplement; Intel is not ARM coverage
        type: choice
        default: macos-15
        options:
          - macos-15
          - macos-15-intel
  pull_request:
  push:
    branches: [main, "dev/**"]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}-${{ inputs.mobile_ios_app || false }}-${{ inputs.macos_lifecycle_runner || 'macos-15' }}
  cancel-in-progress: true

jobs:
  mobile-ios-app:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mobile_ios_app }}
    name: iOS simulator · ad-hoc offline app
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/app/package-lock.json
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mobile/connection
          cache-on-failure: true
      - run: npm ci --prefix mobile/app
      - name: Build complete app with actual Expo, Pods and Rust framework
        env:
          EXPO_PUBLIC_MOBILE_QA: '0'
        shell: bash
        run: |
          set -o pipefail
          mkdir -p output/mobile-ios-simulator
          node mobile/scripts/build-ios-simulator.mjs 2>&1 | tee output/mobile-ios-simulator/build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-ios-simulator-${{ github.sha }}
          retention-days: 7
          path: |
            output/mobile-ios-simulator/build.log
            output/mobile-ios-simulator/source-commit.txt
            output/mobile-ios-simulator/acceptance.txt
            output/mobile-ios-simulator/*.tar.gz
            mobile/app/modules/moxbots-remote/ios/Frameworks/MoxConnectionCore.xcframework/**/native-build.json
          if-no-files-found: error

  mobile-portable:
    if: ${{ !inputs.mobile_ios_app && inputs.macos_lifecycle_runner != 'macos-15-intel' }}
    name: mobile SDK · app policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/app/package-lock.json
      - run: npm ci --prefix mobile/app
      - run: npm --prefix mobile/app run typecheck
      - run: npm --prefix mobile/app run lint
      - run: npm --prefix mobile/app run test:policy
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            mobile/crypto
            mobile/core
            mobile/connection
            mobile/asset-store
            src-tauri/host-management-protocol
            services/agentnet/mobile-notify-core
      - name: Validate portable controller, journal, wire and byte owners
        run: |
          # The imported desktop store harness launches a hardcoded root-module
          # subprocess test name; it runs in its original crate, not this module adapter.
          cargo test --manifest-path mobile/crypto/Cargo.toml --locked --features native-store native_store_tests
          cargo clippy --manifest-path mobile/crypto/Cargo.toml --locked --features native-store --all-targets -- -D warnings
          cargo test --manifest-path mobile/core/Cargo.toml --locked
          cargo clippy --manifest-path mobile/core/Cargo.toml --locked --all-targets -- -D warnings
          cargo test --manifest-path mobile/connection/Cargo.toml --locked
          cargo clippy --manifest-path mobile/connection/Cargo.toml --locked --all-targets -- -D clippy::disallowed_methods -D clippy::disallowed_macros
          cargo test --manifest-path mobile/asset-store/Cargo.toml --locked
          cargo clippy --manifest-path mobile/asset-store/Cargo.toml --locked --all-targets -- -D warnings
          cargo test --manifest-path src-tauri/host-management-protocol/Cargo.toml --locked
          cargo test --manifest-path services/agentnet/mobile-notify-core/Cargo.toml --locked
          cargo clippy --manifest-path services/agentnet/mobile-notify-core/Cargo.toml --locked --all-targets -- -D warnings

  headless-network:
    if: ${{ !inputs.mobile_ios_app && inputs.macos_lifecycle_runner != 'macos-15-intel' }}
    name: headless AgentNet connector · no desktop
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify original Host mobile admission, images, approvals and restart recovery
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          node --import tsx scripts/verify-mobile-original-host-loopback.ts
          node --import tsx scripts/verify-mobile-original-host-loopback.ts --image-boundary
          node --import tsx scripts/verify-mobile-original-host-interactions.ts
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri/headless-network
            services/agentnet
            mobile/connection
      - name: Validate standalone network owner
        run: |
          cargo test --manifest-path src-tauri/headless-network/Cargo.toml --locked
          cargo clippy --manifest-path src-tauri/headless-network/Cargo.toml --locked --all-targets -- -D clippy::disallowed_methods -D clippy::disallowed_macros
          cargo build --manifest-path src-tauri/headless-network/Cargo.toml --locked --release --bin myagents-host-network
          cargo tree --manifest-path src-tauri/headless-network/Cargo.toml --locked > /tmp/headless-network-dependencies.txt
          if rg -i 'tauri|webkit|gtk|keyring|secret-service' /tmp/headless-network-dependencies.txt; then
            echo 'Headless network owner unexpectedly depends on a desktop backend' >&2
            exit 1
          fi
          python3 scripts/host/network-install.test.py
          python3 scripts/host/network-control-daemon.test.py
          python3 scripts/host/unified-install.test.py
          python3 scripts/host/one-command.test.py
      - name: Verify actual notification source across Node, native publisher and service stores
        timeout-minutes: 15
        run: |
          # Compile/fetch the separate locked service fixture before its child
          # process runs offline. Only isolated temporary owners and loopback
          # TLS are used; this never enrolls a real device or invokes a real Session.
          cargo test --manifest-path services/agentnet/Cargo.toml --locked --no-run actual_host_source_service_fixture
          cargo test --manifest-path src-tauri/headless-network/Cargo.toml --locked --offline actual_publish_private_node_source -- --ignored --nocapture
      - name: Verify original encrypted mobile and Host session chain
        timeout-minutes: 15
        run: |
          # Actual original clients, TLS/WSS, Host/SDK and SessionStore; isolated
          # synthetic login and loopback supplier only. No production grants.
          node scripts/verify-mobile-full-host-e2e.mjs
          node scripts/verify-mobile-full-host-e2e.mjs --assets
          node scripts/verify-mobile-full-host-e2e.mjs --ffi
          node scripts/verify-mobile-full-host-e2e.mjs --renewal
      - name: Record Linux artifact provenance
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          mkdir -p output/headless-network
          cp src-tauri/headless-network/target/release/myagents-host-network output/headless-network/
          cp scripts/host/network-install.py scripts/host/network-control.py scripts/host/unified-install.py scripts/host/install.sh output/headless-network/
          cd output/headless-network
          sha256sum myagents-host-network network-install.py network-control.py unified-install.py install.sh > SHA256SUMS
          cat SHA256SUMS
          printf '%s\n' "$SOURCE_COMMIT" > source-commit.txt
          ldd myagents-host-network > native-dependencies.txt
          if rg -i 'gtk|webkit|dbus|gobject' native-dependencies.txt; then
            echo 'Headless network artifact unexpectedly links desktop libraries' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: headless-network-linux
          path: output/headless-network/
          if-no-files-found: error

  # The headless identity store must build without Tauri/GTK or a desktop
  # credential service. Actual systemd projection is a separate server gate.
  headless-identity:
    if: ${{ !inputs.mobile_ios_app && inputs.macos_lifecycle_runner != 'macos-15-intel' }}
    name: headless identity store · no desktop
    # Match the first authorized Linux acceptance server's glibc baseline.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri/agent-network-crypto
      - name: Validate independent headless store
        run: |
          cargo test --manifest-path src-tauri/agent-network-crypto/Cargo.toml --locked
          cargo clippy --manifest-path src-tauri/agent-network-crypto/Cargo.toml --locked --all-targets -- -D clippy::disallowed_methods -D clippy::disallowed_macros
          cargo build --manifest-path src-tauri/agent-network-crypto/Cargo.toml --locked --release --bin identity-store-check
          cargo tree --manifest-path src-tauri/agent-network-crypto/Cargo.toml --locked > /tmp/headless-store-dependencies.txt
          if rg -i 'tauri|webkit|gtk|keyring|secret-service' /tmp/headless-store-dependencies.txt; then
            echo 'Headless identity store unexpectedly depends on a desktop backend' >&2
            exit 1
          fi
      - name: Record native test artifact provenance
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          mkdir -p output/headless-identity
          cp src-tauri/agent-network-crypto/target/release/identity-store-check output/headless-identity/
          cd output/headless-identity
          sha256sum identity-store-check > identity-store-check.sha256
          printf '%s\n' "$SOURCE_COMMIT" > source-commit.txt
          ldd identity-store-check > native-dependencies.txt
          if rg -i 'gtk|webkit|dbus|gobject' native-dependencies.txt; then
            echo 'Headless identity artifact unexpectedly links desktop libraries' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: headless-identity-store-linux
          path: output/headless-identity/
          if-no-files-found: error

  # JS/TS gate: typecheck + lint + deterministic test projects + bundle smoke.
  #
  # `integration` is the CI-safe stateful pool: serial, scratch filesystem and
  # loopback-only network via setup-integration.ts. Real Provider / SDK smoke
  # lives in `credentialed` and is intentionally excluded from public CI.
  js:
    if: ${{ !inputs.mobile_ios_app && inputs.macos_lifecycle_runner != 'macos-15-intel' }}
    name: typecheck · lint · tests · build smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate Linux Bot policy and receipt recovery before broad gates
        run: npx vitest run --project unit src/server/host-bot-delegation.unit.test.ts src/server/host-bot-runtime.unit.test.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:classification
      - run: npm run test:build-scripts
      - run: npm run test:unit
      # `dom` project (jsdom, no secrets) holds security-invariant tests —
      # externalResourceGuard (zero-egress) + WidgetRenderer (about:srcdoc
      # transport). Must gate too, else those regressions wouldn't block a merge.
      - run: npm run test:dom
      - run: npm run test:integration
      - name: Verify native SDK context recovery with isolated loopback fixtures
        run: |
          node --import tsx/esm scripts/verify-context-recovery-loopback.ts
          node --import tsx/esm scripts/verify-context-recovery-loopback.ts --auto
          node --import tsx/esm scripts/verify-context-recovery-loopback.ts --fail-compact
      - name: Verify native SDK background lifetimes and bounded inference retries
        run: |
          node --import tsx/esm scripts/verify-background-lifecycle-loopback.ts
          node --import tsx/esm scripts/verify-background-lifecycle-loopback.ts --after-recovery
          node --import tsx/esm scripts/verify-model-failover-loopback.ts
          node --import tsx/esm scripts/verify-model-failover-loopback.ts --stream-failure
          node --import tsx/esm scripts/verify-model-failover-loopback.ts --stop-during-retry
          node --import tsx/esm scripts/verify-model-failover-loopback.ts --upstream-rejection
          node --import tsx/esm scripts/verify-model-failover-loopback.ts --declined-recovery
      - name: Verify durable model waiting and same-history safe continuation with native SDK
        run: node --import tsx/esm scripts/verify-model-recovery-loopback.ts
      # Typecheck does not exercise esbuild/Vite bundling, raw imports, or
      # runtime entrypoint packaging. These cheap smoke builds catch that class.
      - run: npm run build:server
      - run: npm run build:bridge
      - run: npm run build:cli
      - run: npm run build:web
      - name: Build isolated MoX bot JS profiles
        run: npm run build:assets
        env:
          MYAGENTS_BUILD_PROFILE: moxbot
  # Build independently so real-systemd feedback does not wait for broad UI
  # tests. Those tests remain separate required gates for the same source.
  host-package:
    if: ${{ !inputs.mobile_ios_app && inputs.macos_lifecycle_runner != 'macos-15-intel' }}
    name: Linux Host package · paired provenance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Cache integrity-pinned Host build resources
        uses: actions/cache@v4
        with:
          path: output/host-ci/cache
          key: host-linux-resources-${{ hashFiles('scripts/node-runtime.json', 'package-lock.json') }}
      - name: Build Linux Host test artifact
        run: |
          npm run build:host
          MYAGENTS_HOST_PROFILE=moxbot-test npm run build:host
          printf '%s\n' "$SOURCE_COMMIT" > output/host-ci/source-commit.txt
          python3 - <<'PY'
          import json, os, tarfile
          from pathlib import Path
          root = Path('output/host-ci')
          expected = {'myagents-host-test-*.tar.gz': 'myagents-test',
                      'moxbot-host-test-*.tar.gz': 'moxbot-test'}
          archives = []
          for pattern, profile in expected.items():
              matches = list(root.glob(pattern))
              if len(matches) != 1:
                  raise SystemExit(f'Expected exactly one {profile} Host archive')
              archives.append((matches[0], profile))
          if len(list(root.glob('install-*.sh'))) != 2:
              raise SystemExit('Expected one pinned bootstrap for each Host profile')
          expected_bootstraps = set()
          for archive_path, profile in archives:
              with tarfile.open(archive_path, 'r:gz') as archive:
                  manifests = [m for m in archive.getmembers() if m.name.endswith('/manifest.json')]
                  if len(manifests) != 1:
                      raise SystemExit(f'{profile} Host artifact manifest missing or ambiguous')
                  manifest = json.load(archive.extractfile(manifests[0]))
              if manifest['profile'] != profile:
                  raise SystemExit(f'{profile} Host artifact profile mismatch')
              if manifest['sourceDirty'] or manifest['sourceCommit'] != os.environ['SOURCE_COMMIT']:
                  raise SystemExit(f'{profile} Host artifact source provenance mismatch')
              release_id = manifest['releaseId']
              bootstrap_name = ('install-' if profile == 'myagents-test' else 'install-moxbot-') + release_id + '.sh'
              expected_bootstraps.add(bootstrap_name)
              bootstrap = (root / bootstrap_name).read_text()
              if f"readonly PROFILE='{profile}'" not in bootstrap:
                  raise SystemExit(f'{profile} Host bootstrap profile mismatch')
          if {path.name for path in root.glob('install-*.sh')} != expected_bootstraps:
              raise SystemExit('Host bootstrap names do not match their profile/release IDs')
          PY
        env:
          MYAGENTS_HOST_OUTPUT: output/host-ci
          SOURCE_COMMIT: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: headless-host-linux
          path: |
            output/host-ci/myagents-host-test-*.tar.gz
            output/host-ci/myagents-host-test-*.tar.gz.sha256
            output/host-ci/moxbot-host-test-*.tar.gz
            output/host-ci/moxbot-host-test-*.tar.gz.sha256
            output/host-ci/install-*.sh
            output/host-ci/source-commit.txt
          if-no-files-found: error

  # Exercise actual systemd and packaged Node on a disposable hosted VM.
  # Browser/OIDC admission remains a separate release gate; no account is used.
  host-systemd:
    name: Ubuntu Host installation · actual systemd
    needs: [host-package, headless-network]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: headless-host-linux
          path: ${{ runner.temp }}/moxbots-systemd-input/host
      - uses: actions/download-artifact@v4
        with:
          name: headless-network-linux
          path: ${{ runner.temp }}/moxbots-systemd-input/network
      - name: Verify real package installation, no-op, locking and rollback
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          ACCEPTANCE_OUTPUT: ${{ runner.temp }}/moxbots-systemd-evidence
          ACCEPTANCE_INPUT: ${{ runner.temp }}/moxbots-systemd-input
        run: |
          sudo --preserve-env=CI,GITHUB_ACTIONS,GITHUB_REPOSITORY,RUNNER_ENVIRONMENT,RUNNER_TEMP \
            python3 scripts/host/systemd-acceptance.py \
            --source-root "$GITHUB_WORKSPACE" --source-commit "$SOURCE_COMMIT" \
            --host-artifact-dir "$ACCEPTANCE_INPUT/host" \
            --network-artifact-dir "$ACCEPTANCE_INPUT/network" \
            --output "$ACCEPTANCE_OUTPUT"
      - name: Keep bounded non-secret acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-systemd-acceptance-linux
          path: |
            ${{ runner.temp }}/moxbots-systemd-evidence/summary.json
            ${{ runner.temp }}/moxbots-systemd-evidence/*.log
          if-no-files-found: warn

  # Rust gate: cargo test plus project redline Clippy rules. We only deny
  # disallowed_methods/macros here; ordinary Clippy warnings stay non-fatal
  # until they are cleaned up in a dedicated phase.
  rust:
    if: ${{ !inputs.mobile_ios_app && inputs.macos_lifecycle_runner != 'macos-15-intel' }}
    name: cargo test · clippy redlines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libpipewire-0.3-dev \
            libasound2-dev \
            build-essential \
            file
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Prepare Tauri bundle path placeholders for cargo tests
        run: |
          # Tauri validates bundle resource paths during build-script execution.
          # This Linux CI job runs Rust unit tests, not a distributable Linux
          # bundle, so provide inert runner-local placeholders for paths that
          # are intentionally not committed.
          mkdir -p src-tauri/resources/claude-agent-sdk
          mkdir -p src-tauri/resources/sharp-runtime
          mkdir -p src-tauri/resources/tsx-runtime
          mkdir -p src-tauri/resources/nodejs
          mkdir -p src-tauri/resources/integrated-runtimes/dsh
          mkdir -p src-tauri/resources/speech-inference
          mkdir -p src-tauri/resources/playwright-control/@playwright/mcp
          mkdir -p src-tauri/resources/playwright-control/playwright
          mkdir -p src-tauri/resources/playwright-control/playwright-core
          printf 'console.log("ci server-dist placeholder");\n' > src-tauri/resources/server-dist.js
          printf 'console.log("ci plugin-bridge placeholder");\n' > src-tauri/resources/plugin-bridge-dist.mjs
          printf 'ci placeholder\n' > src-tauri/resources/claude-agent-sdk/.ci-placeholder
          printf 'ci placeholder\n' > src-tauri/resources/sharp-runtime/.ci-placeholder
          printf 'ci placeholder\n' > src-tauri/resources/tsx-runtime/.ci-placeholder
          printf 'ci placeholder\n' > src-tauri/resources/nodejs/.ci-placeholder
          printf 'ci placeholder\n' > src-tauri/resources/integrated-runtimes/dsh/.ci-placeholder
          printf 'ci placeholder\n' > src-tauri/resources/playwright-control/@playwright/mcp/.ci-placeholder
          printf 'ci placeholder\n' > src-tauri/resources/playwright-control/playwright/.ci-placeholder
          printf 'ci placeholder\n' > src-tauri/resources/playwright-control/playwright-core/.ci-placeholder
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Validate isolated MoX bot Rust profile
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked app_profile_tests
        env:
          MYAGENTS_BUILD_PROFILE: moxbot
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D clippy::disallowed_methods -D clippy::disallowed_macros

  # `--all-targets` above covers Rust target kinds for Linux; it does not
  # type-check or execute `cfg(windows)`. Run workspace IO tests natively:
  # compile-only checks cannot detect invalid OS rename parameters (#641).
  windows-rust:
    if: ${{ !inputs.mobile_ios_app && inputs.macos_lifecycle_runner != 'macos-15-intel' }}
    name: Windows cargo check · workspace IO
    # Explicit compatible pool: latest repeatedly failed to acquire a runner.
    runs-on: windows-2022
    steps:
      - name: Confirm Windows x64 validation environment
        shell: pwsh
        run: |
          if ($env:RUNNER_ARCH -ne 'X64') { throw "Expected x64 runner, got $env:RUNNER_ARCH" }
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, OSArchitecture
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify bundled Node replacement with native NSIS
        shell: pwsh
        run: |
          node --test scripts/ci/download-nsis.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $nsisArchive = Join-Path $env:RUNNER_TEMP 'nsis-3.13.zip'
          node scripts/ci/download-nsis.mjs $nsisArchive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $nsisRoot = Join-Path $env:RUNNER_TEMP 'myagents-nsis'
          Expand-Archive -LiteralPath $nsisArchive -DestinationPath $nsisRoot
          $env:MYAGENTS_TEST_MAKENSIS = Join-Path $nsisRoot 'nsis-3.13\makensis.exe'
          if (!(Test-Path -LiteralPath $env:MYAGENTS_TEST_MAKENSIS -PathType Leaf)) {
            throw "Verified NSIS archive lacks compiler: $env:MYAGENTS_TEST_MAKENSIS"
          }
          $nsisVersion = & $env:MYAGENTS_TEST_MAKENSIS /VERSION
          if ($LASTEXITCODE -ne 0 -or "$nsisVersion".Trim() -ne 'v3.13') {
            throw "NSIS compiler probe failed: path=$env:MYAGENTS_TEST_MAKENSIS version=$nsisVersion exit=$LASTEXITCODE"
          }
          Write-Host "Native NSIS compiler: $env:MYAGENTS_TEST_MAKENSIS ($nsisVersion)"
          node --test scripts/windows-node-runtime-install.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare signed CLIProxy build inputs
        run: node scripts/prepare-cliproxy.mjs win32-x64
      - name: Verify selective Sherpa source extraction on Windows
        run: node --test scripts/sherpa-source-extraction.test.mjs
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Prepare Tauri resources for Windows Rust validation
        shell: pwsh
        run: |
          $resourceDirs = @(
            'src-tauri/resources/claude-agent-sdk',
            'src-tauri/resources/sharp-runtime',
            'src-tauri/resources/tsx-runtime',
            'src-tauri/resources/nodejs',
            'src-tauri/resources/integrated-runtimes/dsh',
            'src-tauri/resources/speech-inference',
            'src-tauri/resources/cli',
            'src-tauri/resources/playwright-control/@playwright/mcp',
            'src-tauri/resources/playwright-control/playwright',
            'src-tauri/resources/playwright-control/playwright-core'
          )
          foreach ($directory in $resourceDirs) {
            New-Item -ItemType Directory -Path $directory -Force | Out-Null
          }
          Set-Content src-tauri/resources/server-dist.js 'console.log("ci server-dist placeholder");'
          Set-Content src-tauri/resources/plugin-bridge-dist.mjs 'console.log("ci plugin-bridge placeholder");'
          Set-Content src-tauri/resources/claude-agent-sdk/.ci-placeholder 'ci placeholder'
          Set-Content src-tauri/resources/sharp-runtime/.ci-placeholder 'ci placeholder'
          Set-Content src-tauri/resources/tsx-runtime/.ci-placeholder 'ci placeholder'
          Set-Content src-tauri/resources/nodejs/.ci-placeholder 'ci placeholder'
          Set-Content src-tauri/resources/integrated-runtimes/dsh/.ci-placeholder 'ci placeholder'
          Set-Content src-tauri/resources/cli/.ci-placeholder 'ci placeholder'
          Set-Content src-tauri/resources/playwright-control/@playwright/mcp/.ci-placeholder 'ci placeholder'
          Set-Content src-tauri/resources/playwright-control/playwright/.ci-placeholder 'ci placeholder'
          Set-Content src-tauri/resources/playwright-control/playwright-core/.ci-placeholder 'ci placeholder'
          # Tauri copies these beside the native binary: execution needs real
          # VC runtimes, matching the existing Windows build preparation.
          Copy-Item (Join-Path $env:WINDIR 'System32\vcruntime140.dll') src-tauri/resources/vcruntime140.dll
          Copy-Item (Join-Path $env:WINDIR 'System32\vcruntime140_1.dll') src-tauri/resources/vcruntime140_1.dll
      - run: cargo check --manifest-path src-tauri/Cargo.toml --locked
      - name: Run native workspace IO tests with Tauri's application manifest
        shell: pwsh
        run: |
          $messages = & cargo test --manifest-path src-tauri/Cargo.toml --locked --lib --no-run --message-format=json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $testExecutable = $messages | ForEach-Object { $_ | ConvertFrom-Json } |
            Where-Object { $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'app_lib' -and $_.executable } |
            Select-Object -ExpandProperty executable
          if (@($testExecutable).Count -ne 1) { throw 'Expected one application library test executable' }
          # Tauri's resource compiler links the common-controls v6 manifest to
          # app binaries only; the library test imports the same dialog APIs.
          $metadata = & cargo metadata --manifest-path src-tauri/Cargo.toml --locked --format-version=1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tauriBuild = $metadata.packages | Where-Object { $_.name -eq 'tauri-build' }
          if (@($tauriBuild).Count -ne 1) { throw 'Expected one resolved tauri-build package' }
          $manifest = Join-Path (Split-Path $tauriBuild.manifest_path) 'src/windows-app-manifest.xml'
          $mt = Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin/*/x64/mt.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $mt) { throw 'Windows SDK manifest tool not found' }
          & $mt -nologo -manifest $manifest "-outputresource:$testExecutable;#1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $testExecutable 'workspace_files::'
          exit $LASTEXITCODE
      - name: Inspect native test loader imports on failure
        if: failure()
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $dumpbin = & $vswhere -latest -products '*' -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          Get-ChildItem src-tauri/target/debug/deps/app_lib-*.exe | ForEach-Object { & $dumpbin /imports $_.FullName }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-workspace-test-loader
          path: src-tauri/target/debug/deps/app_lib-*.exe
          retention-days: 1

  # CLIProxy native lifecycle fixtures require a supported Unix platform.
  # Keep Linux's broad Rust gate; apple-metal requires the Xcode 26 SDK.
  macos-cliproxy:
    if: ${{ !inputs.mobile_ios_app }}
    name: macOS CLIProxy lifecycle
    # Keep ARM and all lifecycle checks; macos-26 repeatedly had no capacity.
    # macos-15 defaults to Xcode16.4, below apple-metal's SDK floor, so select26.3.
    runs-on: ${{ inputs.macos_lifecycle_runner == 'macos-15-intel' && 'macos-15-intel' || 'macos-15' }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      MACOS_LIFECYCLE_RUNNER: ${{ inputs.macos_lifecycle_runner || 'macos-15' }}
      MACOS_EXPECTED_ARCH: ${{ inputs.macos_lifecycle_runner == 'macos-15-intel' && 'x86_64' || 'arm64' }}
      MACOS_EXPECTED_RUST_HOST: ${{ inputs.macos_lifecycle_runner == 'macos-15-intel' && 'x86_64-apple-darwin' || 'aarch64-apple-darwin' }}
    steps:
      - name: Confirm selected Apple architecture and compatible SDK environment
        run: |
          case "$MACOS_LIFECYCLE_RUNNER" in macos-15|macos-15-intel) ;; *) exit 1 ;; esac
          uname -m
          test "$(uname -m)" = "$MACOS_EXPECTED_ARCH"
          xcodebuild -version
          test "$(xcrun --sdk macosx --show-sdk-version)" = 26.2
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = 26.2
          test "$(xcrun --sdk iphonesimulator --show-sdk-version)" = 26.2
      - uses: actions/checkout@v4
      - name: Verify arm64 host and Xcode 26 SDK
        if: env.MACOS_EXPECTED_ARCH == 'arm64'
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          test "$(xcrun --sdk macosx --show-sdk-version | cut -d. -f1)" -ge 26
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@1.92.0
      - name: Confirm selected Rust host architecture
        run: |
          rustc -vV
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$MACOS_EXPECTED_RUST_HOST"
      - name: Record actual lifecycle validation environment
        run: |
          node - <<'NODE'
          const fs = require('node:fs'), cp = require('node:child_process');
          const read = (name, args) => cp.execFileSync(name, args, { encoding: 'utf8' }).trim();
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, ['## macOS lifecycle environment', `Runner: ${process.env.MACOS_LIFECYCLE_RUNNER}`, `Architecture: ${read('uname', ['-m'])}`, `Rust: ${read('rustc', ['-vV'])}`, `Xcode: ${read('xcodebuild', ['-version'])}`, `SDKs: ${['macosx', 'iphoneos', 'iphonesimulator'].map(s => `${s}=${read('xcrun', ['--sdk', s, '--show-sdk-version'])}`).join(', ')}`, 'Results cover the recorded architecture. An Intel-only supplement does not establish ARM desktop artifact acceptance or replace the other exact-head PR checks.', ''].join('\n\n'));
          NODE
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            mobile/connection
      - name: Check iOS native core against actual device and simulator SDKs
        run: node mobile/scripts/check-ios-native.mjs
      - name: Prepare signed CLIProxy build inputs
        run: node scripts/prepare-cliproxy.mjs
      - name: Prepare non-executed Tauri resource paths
        run: |
          mkdir -p src-tauri/resources/{claude-agent-sdk,sharp-runtime,tsx-runtime,nodejs,speech-inference,cli,document-processing,integrated-runtimes/dsh}
          mkdir -p src-tauri/resources/playwright-control/{@playwright/mcp,playwright,playwright-core}
          for directory in claude-agent-sdk sharp-runtime tsx-runtime nodejs speech-inference cli document-processing integrated-runtimes/dsh playwright-control/@playwright/mcp playwright-control/playwright playwright-control/playwright-core; do
            touch "src-tauri/resources/$directory/.ci-placeholder"
          done
          touch src-tauri/resources/server-dist.js src-tauri/resources/plugin-bridge-dist.mjs
      - name: Test native component lifecycle without provider credentials
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          cargo test --manifest-path src-tauri/Cargo.toml --locked --lib 'cliproxy::' --config "target.$host.runner = ['env', 'DYLD_FALLBACK_LIBRARY_PATH=/usr/lib/swift']"
      - name: Test cacheless workspace change notifications on macOS
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          cargo test --manifest-path src-tauri/Cargo.toml --locked --lib 'workspace_files::watcher::tests' --config "target.$host.runner = ['env', 'DYLD_FALLBACK_LIBRARY_PATH=/usr/lib/swift']"
      - name: Test native network CLI identity and recovery boundaries
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          cargo test --manifest-path src-tauri/Cargo.toml --locked --lib 'agent_network::' --config "target.$host.runner = ['env', 'DYLD_FALLBACK_LIBRARY_PATH=/usr/lib/swift']"
          cargo test --manifest-path src-tauri/Cargo.toml --locked --lib 'cli::' --config "target.$host.runner = ['env', 'DYLD_FALLBACK_LIBRARY_PATH=/usr/lib/swift']"
      - name: Test bounded credential transport without accessing Keychain
        run: |
          cargo test --manifest-path src-tauri/agent-network-crypto/Cargo.toml --locked --features os-store
          cargo clippy --manifest-path src-tauri/agent-network-crypto/Cargo.toml --locked --features os-store --all-targets -- -D warnings
      - name: Test immutable MoXBots credential component without accessing Keychain
        run: |
          node --test scripts/prepare-moxbot-credential-reader.test.mjs
          cargo test --manifest-path src-tauri/agent-network-crypto/Cargo.toml --locked --features os-store,fixed-macos-reader
          cargo clippy --manifest-path src-tauri/agent-network-crypto/Cargo.toml --locked --features os-store,fixed-macos-reader --all-targets -- -D warnings
      - name: Check actual MoXBots desktop credential routing configuration
        env:
          MYAGENTS_BUILD_PROFILE: moxbot
          MOXBOTS_CREDENTIAL_WRITER_FAMILY: developer-id-v2
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked --lib --features moxbot-credential-reader
