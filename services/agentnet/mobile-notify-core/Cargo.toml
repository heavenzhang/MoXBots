[package]
name = "myagents-agentnet-mobile-notify-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false

[dependencies]
libc = "=0.2.190"
nix = { version = "=0.30.1", features = ["user"] }
rusqlite = { version = "=0.37.0", features = ["bundled"] }
serde = { version = "=1.0.228", features = ["derive"] }
sha2 = "=0.10.9"
thiserror = "=2.0.17"
uuid = { version = "=1.18.1", features = ["v4"] }
zeroize = { version = "=1.8.2", features = ["serde"] }

[dev-dependencies]
serde_json = "=1.0.154"
tempfile = "=3.23.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
